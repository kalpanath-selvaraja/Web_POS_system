<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/styles/style.css">

</head>
<body>
<header>

</header>
<main>
    <!--     Login-->
    <section class="container-fluid h-100" id="login">

        <div class="row h-100 box-container">
            <div class="col-md-8 d-none d-md-flex flex-column justify-content-center align-items-center left-side text-center" >
                <div>
                    <div class="title">SmartPOS</div>
                    <p class="tagline mt-3">Simplifying Retail Management</p>
                </div>
            </div>

            <div class="col-md-4 d-flex justify-content-center align-items-center right-side bg-light">

                <div class="card p-4 shadow login-card w-75">
                    <h4 class="text-center mb-5">Login</h4>

                    <div class="mb-4">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Username</label>
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>

                    <button id="btn_login" class="btn btn-primary w-100">Login</button>
                </div>
            </div>
        </div>

    </section>
</main>
<script src="assets/lib/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="controller/LoginController.js"></script>
</body>
</html>
